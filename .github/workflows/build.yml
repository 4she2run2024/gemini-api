name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: bash Tests/run-tests.sh --auto

      - name: Build
        run: ./build.sh

      - name: Verify build artifacts
        run: bash Tests/build-artifact-tests.sh --auto

      - name: Zip app
        run: ditto -c -k --keepParent "Gemini2API.app" Gemini2API-macOS.zip

      - name: Make DMG
        run: |
          brew install create-dmg
          ./make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Gemini2API-macOS
          path: |
            Gemini2API-macOS.zip
            Gemini2API.dmg
            gemini2api-macOS
